openapi: 3.1.0
info:
  title: SmartService API
  version: 1.0.0
  description: Demo API contract for P0, P1 and optional R11.
servers:
  - url: https://api.example.com
paths:
  /v1/public/conversations:
    post:
      operationId: createPublicConversation
      summary: Create a public text or voice conversation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConversationResponse'
  /v1/public/conversations/{conversationId}/messages:
    get:
      operationId: listPublicConversationMessages
      summary: Poll customer-visible messages after a cursor
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: after
          in: query
          description: Opaque cursor returned by the previous response
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      security:
        - conversationToken: []
      responses:
        '200':
          description: Customer-visible AI, human, and system messages for this conversation only
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMessageListResponse'
    post:
      operationId: sendPublicMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      security:
        - conversationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: AI or handoff response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
  /v1/public/conversations/{conversationId}/request-handoff:
    post:
      operationId: requestPublicHandoff
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - conversationToken: []
      responses:
        '202':
          description: Handoff requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestHandoffResponse'
  /v1/public/voice/token:
    post:
      operationId: createVoiceToken
      security:
        - conversationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId]
              properties:
                conversationId: { type: string, format: uuid }
      responses:
        '201':
          description: Short-lived LiveKit token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVoiceTokenResponse'
  /v1/public/voice/sessions/{voiceSessionId}/end:
    post:
      operationId: endVoiceSession
      security:
        - conversationToken: []
      parameters:
        - $ref: '#/components/parameters/VoiceSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId]
              properties:
                conversationId: { type: string, format: uuid }
      responses:
        '200':
          description: Customer-ended voice lifecycle state persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndVoiceSessionResponse'
  /v1/internal/voice/sessions/{voiceSessionId}/config:
    get:
      operationId: getVoiceSessionConfiguration
      security:
        - voiceServiceToken: []
      parameters:
        - $ref: '#/components/parameters/VoiceSessionId'
      responses:
        '200':
          description: Minimum tenant-bound Agent configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSessionConfiguration'
  /v1/internal/voice/sessions/{voiceSessionId}/status:
    post:
      operationId: updateVoiceSessionStatus
      security:
        - voiceServiceToken: []
      parameters:
        - $ref: '#/components/parameters/VoiceSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVoiceSessionStatusRequest'
      responses:
        '204':
          description: Lifecycle state recorded
  /v1/internal/voice/sessions/{voiceSessionId}/transcripts:
    post:
      operationId: recordVoiceTranscript
      security:
        - voiceServiceToken: []
      parameters:
        - $ref: '#/components/parameters/VoiceSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordVoiceTranscriptRequest'
      responses:
        '201':
          description: Final transcript persisted idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordVoiceTranscriptResponse'
  /v1/internal/voice/sessions/{voiceSessionId}/turns:
    post:
      operationId: completeVoiceTurn
      security:
        - voiceServiceToken: []
      parameters:
        - $ref: '#/components/parameters/VoiceSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteVoiceTurnRequest'
      responses:
        '201':
          description: Shared grounded and guardrail-approved voice answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteVoiceTurnResponse'
  /v1/admin/knowledge/file-upload-intents:
    post:
      operationId: createFileUploadIntent
      summary: Create a short-lived, single-object R2 signed PUT URL
      security:
        - supabaseJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadIntentRequest'
      responses:
        '201':
          description: Signed upload intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadIntentResponse'
  /v1/admin/knowledge/file-intakes:
    post:
      operationId: createFileKnowledgeIntake
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileIntakeRequest'
      responses:
        '202':
          description: Ingestion queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
  /v1/admin/knowledge/url-intakes:
    post:
      operationId: createUrlKnowledgeIntake
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlIntakeRequest'
      responses:
        '202':
          description: Crawl queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
  /v1/admin/knowledge/sources:
    get:
      operationId: listKnowledgeSources
      security:
        - supabaseJwt: []
      responses:
        '200':
          description: Tenant-scoped active knowledge sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceListResponse'
  /v1/admin/knowledge/sources/{sourceId}:
    get:
      operationId: getKnowledgeSource
      security:
        - supabaseJwt: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Source status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSource'
    delete:
      operationId: deleteKnowledgeSource
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Source tombstoned and stored objects removed
        '202':
          description: Source tombstoned; stored-object cleanup requires follow-up
  /v1/admin/knowledge/sources/{sourceId}/actions/{action}:
    post:
      operationId: applyKnowledgeSourceAction
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [disable, enable, retry] }
      responses:
        '200':
          description: Updated source and optional retry job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceActionResponse'
  /v1/admin/knowledge-gaps:
    get:
      operationId: listKnowledgeGaps
      summary: List grouped tenant knowledge gaps in priority order
      security:
        - supabaseJwt: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, ignored] }
      responses:
        '200':
          description: Tenant-scoped grouped knowledge gaps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGapListResponse'
  /v1/admin/knowledge-gaps/{gapId}:
    get:
      operationId: getKnowledgeGap
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/GapId'
      responses:
        '200':
          description: Grouped gap detail and manual-source progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGap'
  /v1/admin/knowledge-gaps/{gapId}/resolve:
    post:
      operationId: resolveKnowledgeGap
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/GapId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveKnowledgeGapRequest'
      responses:
        '202':
          description: Manual knowledge queued for embedding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveKnowledgeGapResponse'
  /v1/admin/knowledge-gaps/{gapId}/actions/{action}:
    post:
      operationId: applyKnowledgeGapAction
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/GapId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [ignore, reopen] }
      responses:
        '200':
          description: Updated grouped gap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGap'
  /v1/admin/knowledge-gaps/{gapId}/retest:
    post:
      operationId: retestKnowledgeGap
      summary: Re-run the original question against only its ready manual source
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/GapId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Guarded answer with validated manual-source citations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGapRetestResponse'
  /v1/admin/conversations:
    get:
      operationId: listTeamConversations
      security:
        - supabaseJwt: []
      parameters:
        - name: includeClosed
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Tenant-scoped cross-channel conversation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamConversationListResponse'
  /v1/admin/conversations/{conversationId}:
    get:
      operationId: getTeamConversation
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Transcript, citations, customer card, handoff package, redacted guardrails, and final record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamConversationDetail'
  /v1/admin/conversations/{conversationId}/takeover:
    post:
      operationId: takeoverConversation
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Conversation is active_human
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimConversationResponse'
  /v1/admin/conversations/{conversationId}/messages:
    post:
      operationId: sendHumanMessage
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, clientMessageId]
              properties:
                text: { type: string, minLength: 1, maxLength: 5000 }
                clientMessageId: { type: string, format: uuid }
      responses:
        '200':
          description: Human message persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendHumanMessageResponse'
  /v1/admin/conversations/{conversationId}/close:
    post:
      operationId: closeConversation
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Closed and finalization queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseConversationResponse'
  /v1/admin/guardrails/rules:
    get:
      operationId: listGuardrailRules
      security:
        - supabaseJwt: []
      responses:
        '200':
          description: Admin tenant guardrail configuration
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: '#/components/schemas/GuardrailRule' }
    post:
      operationId: createGuardrailRule
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuardrailRuleRequest'
      responses:
        '201':
          description: Guardrail rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailRule'
  /v1/admin/guardrails/rules/{ruleId}:
    patch:
      operationId: updateGuardrailRule
      security:
        - supabaseJwt: []
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuardrailRuleRequest'
      responses:
        '200':
          description: Guardrail rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailRule'
  /v1/admin/guardrails/events:
    get:
      operationId: listGuardrailEvents
      description: Admin-only redacted event list; blocked candidate is never included.
      security:
        - supabaseJwt: []
      parameters:
        - name: conversationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Redacted guardrail events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/GuardrailEvent' }
  /v1/admin/guardrails/events/{eventId}/candidate:
    get:
      operationId: getGuardrailCandidate
      description: Distinct Admin-only authorization boundary for one withheld candidate.
      security:
        - supabaseJwt: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Withheld candidate or null when the input gate blocked before generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailCandidateResponse'
  /v1/admin/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Aggregate exact P0 closed-conversation and open-gap metrics
      security:
        - supabaseJwt: []
      parameters:
        - { name: from, in: query, description: Inclusive range start, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Exclusive range end, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Tenant-scoped dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
  /v1/admin/tickets:
    get:
      operationId: listTickets
      description: Optional R11 endpoint
      security:
        - supabaseJwt: []
      responses:
        '200': { description: Ticket list }
components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    conversationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    voiceServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VoiceSessionId:
      name: voiceSessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GapId:
      name: gapId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  schemas:
    CreateConversationRequest:
      type: object
      required: [publicKey, channel, turnstileToken]
      properties:
        publicKey: { type: string }
        channel: { type: string, enum: [text, voice] }
        customer:
          type: object
          properties:
            name: { type: string, maxLength: 200 }
            email: { type: string, format: email }
            phone: { type: string, maxLength: 50 }
            company: { type: string, maxLength: 200 }
            language: { type: string, default: zh-CN }
        turnstileToken: { type: string }
    CreateConversationResponse:
      type: object
      required:
        [conversationId, conversationToken, displayName, expiresAt, welcomeMessage]
      properties:
        conversationId: { type: string, format: uuid }
        conversationToken: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        expiresAt: { type: string, format: date-time }
        welcomeMessage: { type: string, minLength: 1, maxLength: 500 }
    CreateVoiceTokenResponse:
      type: object
      required:
        [agentName, expiresAt, provider, roomName, token, url, voiceSessionId]
      properties:
        agentName: { type: string, minLength: 1, maxLength: 120 }
        expiresAt: { type: string, format: date-time }
        provider: { type: string, enum: [livekit, mock] }
        roomName: { type: string, minLength: 1, maxLength: 180 }
        token: { type: string, minLength: 16 }
        url: { type: string, format: uri }
        voiceSessionId: { type: string, format: uuid }
    EndVoiceSessionResponse:
      type: object
      required: [status, voiceSessionId]
      properties:
        status: { type: string, enum: [closed, failed] }
        voiceSessionId: { type: string, format: uuid }
    VoiceSessionConfiguration:
      type: object
      required:
        [conversationId, language, organizationId, status, voiceSessionId]
      properties:
        conversationId: { type: string, format: uuid }
        language: { type: string, enum: [zh-CN, en] }
        organizationId: { type: string, format: uuid }
        status:
          {
            type: string,
            enum: [warming, ready, active, handoff, closed, failed],
          }
        voiceSessionId: { type: string, format: uuid }
    UpdateVoiceSessionStatusRequest:
      type: object
      required: [errorCode, status]
      properties:
        errorCode:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 120
        status:
          {
            type: string,
            enum: [warming, ready, active, handoff, closed, failed],
          }
    RecordVoiceTranscriptRequest:
      type: object
      required: [clientMessageId, language, text, transcribedAt]
      properties:
        clientMessageId: { type: string, format: uuid }
        language: { type: string, enum: [zh-CN, en] }
        text: { type: string, minLength: 1, maxLength: 5000 }
        transcribedAt: { type: string, format: date-time }
    RecordVoiceTranscriptResponse:
      type: object
      required: [created, messageId]
      properties:
        created: { type: boolean }
        messageId: { type: string, format: uuid }
    CompleteVoiceTurnRequest:
      type: object
      required: [clientMessageId, text, transcribedAt]
      properties:
        clientMessageId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 5000 }
        transcribedAt: { type: string, format: date-time }
    CompleteVoiceTurnResponse:
      allOf:
        - $ref: '#/components/schemas/SendMessageResponse'
        - type: object
          required: [spokenText]
          properties:
            spokenText: { type: string, minLength: 1, maxLength: 500 }
    SendMessageRequest:
      type: object
      required: [text, clientMessageId]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        clientMessageId: { type: string, format: uuid }
    Citation:
      type: object
      required:
        [citationId, label, sourceType, sourceUrl, supportingExcerpt]
      properties:
        citationId: { type: string, format: uuid }
        label: { type: string }
        sourceType: { type: string, enum: [pdf, docx, url, manual] }
        sourceUrl:
          oneOf:
            - type: 'null'
            - type: string
              format: uri
        supportingExcerpt: { type: string, minLength: 1, maxLength: 2000 }
    SendMessageResponse:
      type: object
      required: [messageId, decision, answer, citations]
      properties:
        messageId: { type: string, format: uuid }
        decision: { type: string, enum: [answer, clarify, handoff] }
        answer: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        handoff:
          oneOf:
            - type: 'null'
            - type: object
              required: [reason, status]
              properties:
                reason:
                  {
                    type: string,
                    enum:
                      [
                        missing_knowledge,
                        conflicting_knowledge,
                        guardrail,
                        customer_requested,
                        system_error,
                      ],
                  }
                status: { type: string, enum: [handoff_requested] }
    RequestHandoffResponse:
      type: object
      required: [messageId, handoff]
      properties:
        messageId: { type: string, format: uuid }
        handoff:
          type: object
          required: [reason, status]
          properties:
            reason: { type: string, enum: [customer_requested] }
            status: { type: string, enum: [handoff_requested] }
    PublicMessage:
      type: object
      required: [messageId, senderType, text, decision, citations, createdAt]
      properties:
        messageId: { type: string, format: uuid }
        senderType: { type: string, enum: [ai, human, system] }
        text: { type: string }
        decision:
          oneOf:
            - type: 'null'
            - type: string
              enum: [answer, clarify, handoff, human]
        citations:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Citation' }
        createdAt: { type: string, format: date-time }
    PublicMessageListResponse:
      type: object
      required: [messages, nextCursor, status]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/PublicMessage' }
        nextCursor:
          oneOf:
            - type: 'null'
            - type: string
        status:
          {
            type: string,
            enum:
              [
                active_ai,
                resolved_ai,
                handoff_requested,
                active_human,
                closed,
              ],
          }
    FileUploadIntentRequest:
      type: object
      required: [kind, fileName, mimeType, sizeBytes, contentSha256]
      properties:
        kind: { type: string, enum: [original, extracted] }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mimeType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/json
        sizeBytes: { type: integer, minimum: 1, maximum: 20000000 }
        contentSha256: { type: string, pattern: '^[A-Fa-f0-9]{64}$' }
    FileUploadIntentResponse:
      type: object
      required: [uploadUrl, objectKey, expiresAt, requiredHeaders]
      properties:
        uploadUrl: { type: string, format: uri }
        objectKey: { type: string }
        expiresAt: { type: string, format: date-time }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }
    FileIntakeRequest:
      type: object
      required: [fileName, mimeType, sizeBytes, originalObjectKey, extractedObjectKey]
      properties:
        fileName: { type: string }
        mimeType: { type: string, enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document] }
        sizeBytes: { type: integer, minimum: 1, maximum: 20000000 }
        pageCount: { type: integer, minimum: 1, maximum: 80 }
        standardPageCount: { type: number, minimum: 0.01, maximum: 100 }
        originalObjectKey: { type: string }
        extractedObjectKey: { type: string }
    UrlIntakeRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        maxPages: { type: integer, minimum: 1, maximum: 30, default: 10 }
        maxDepth: { type: integer, minimum: 0, maximum: 2, default: 2 }
    IntakeResponse:
      type: object
      required: [sourceId, jobId, status]
      properties:
        sourceId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [uploaded, extracting, chunking, embedding, ready, failed] }
    KnowledgeSource:
      type: object
      required:
        - id
        - type
        - name
        - status
        - activeVersion
        - documentCount
        - chunkCount
        - enabled
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [pdf, docx, url, manual] }
        name: { type: string }
        sourceUrl:
          oneOf:
            - type: 'null'
            - type: string
              format: uri
        status: { type: string, enum: [uploaded, extracting, chunking, embedding, ready, failed, disabled] }
        activeVersion: { type: integer, minimum: 1 }
        pageCount:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
        standardPageCount:
          oneOf:
            - type: 'null'
            - type: number
              minimum: 0
        crawlMaxPages:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 1
              maximum: 30
        crawlMaxDepth:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
              maximum: 2
        documentCount: { type: integer, minimum: 0 }
        chunkCount: { type: integer, minimum: 0 }
        errorCode:
          oneOf:
            - type: 'null'
            - type: string
        errorMessage:
          oneOf:
            - type: 'null'
            - type: string
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KnowledgeSourceListResponse:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSource'
    DashboardSummary:
      type: object
      required:
        - from
        - to
        - totalConversations
        - aiContainedConversations
        - handedOffConversations
        - aiContainmentRate
        - handoffRate
        - openKnowledgeGapCount
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totalConversations: { type: integer, minimum: 0 }
        aiContainedConversations: { type: integer, minimum: 0 }
        handedOffConversations: { type: integer, minimum: 0 }
        aiContainmentRate: { type: number, minimum: 0, maximum: 1 }
        handoffRate: { type: number, minimum: 0, maximum: 1 }
        openKnowledgeGapCount: { type: integer, minimum: 0 }
    KnowledgeGapResolutionSource:
      type: object
      required: [id, name, status, chunkCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 240 }
        status: { type: string, enum: [uploaded, extracting, chunking, embedding, ready, failed, disabled] }
        chunkCount: { type: integer, minimum: 0 }
    KnowledgeGap:
      type: object
      required:
        - id
        - normalizedQuestion
        - exampleQuestion
        - firstConversationId
        - occurrenceCount
        - reason
        - status
        - resolutionSource
        - lastSeenAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        normalizedQuestion: { type: string, minLength: 1, maxLength: 2000 }
        exampleQuestion: { type: string, minLength: 1, maxLength: 4000 }
        firstConversationId:
          oneOf:
            - type: 'null'
            - type: string
              format: uuid
        occurrenceCount: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        status: { type: string, enum: [open, resolved, ignored] }
        resolutionSource:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/KnowledgeGapResolutionSource'
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KnowledgeGapListResponse:
      type: object
      required: [gaps]
      properties:
        gaps:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/KnowledgeGap'
    ResolveKnowledgeGapRequest:
      type: object
      required: [title, answer]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        answer: { type: string, minLength: 1, maxLength: 5000 }
        sourceNote: { type: string, minLength: 1, maxLength: 500 }
    ResolveKnowledgeGapResponse:
      type: object
      required: [gapId, sourceId, jobId, status]
      properties:
        gapId: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [uploaded, extracting, chunking, embedding, ready, failed, disabled] }
    KnowledgeGapRetestResponse:
      type: object
      required: [gapId, decision, answer, citations, testedAt]
      properties:
        gapId: { type: string, format: uuid }
        decision: { type: string, enum: [answer, clarify, handoff] }
        answer: { type: string, minLength: 1, maxLength: 5000 }
        citations:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Citation'
        testedAt: { type: string, format: date-time }
    SourceActionResponse:
      type: object
      required: [source]
      properties:
        jobId: { type: string, format: uuid }
        source:
          $ref: '#/components/schemas/KnowledgeSource'
    GuardrailRule:
      type: object
      required:
        [id, code, name, description, severity, ruleType, safeResponse, enabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        severity: { type: string, enum: [low, medium, high, critical] }
        ruleType:
          {
            type: string,
            enum:
              [
                price,
                delivery,
                competitor,
                security,
                unsupported_claim,
                safety,
                custom,
              ],
          }
        safeResponse: { type: string, minLength: 1, maxLength: 4000 }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateGuardrailRuleRequest:
      type: object
      required: [code, name, description, severity, ruleType, safeResponse]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,79}$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        severity: { type: string, enum: [low, medium, high, critical] }
        ruleType:
          {
            type: string,
            enum:
              [
                price,
                delivery,
                competitor,
                security,
                unsupported_claim,
                safety,
                custom,
              ],
          }
        safeResponse: { type: string, minLength: 1, maxLength: 4000 }
        enabled: { type: boolean, default: true }
    UpdateGuardrailRuleRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        severity: { type: string, enum: [low, medium, high, critical] }
        ruleType:
          {
            type: string,
            enum:
              [
                price,
                delivery,
                competitor,
                security,
                unsupported_claim,
                safety,
                custom,
              ],
          }
        safeResponse: { type: string, minLength: 1, maxLength: 4000 }
        enabled: { type: boolean }
    GuardrailEvent:
      type: object
      description: Redacted event; blocked candidate is intentionally absent.
      required:
        [id, conversationId, customerMessageId, ruleId, ruleCode, severity, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        customerMessageId:
          oneOf:
            - type: 'null'
            - type: string
              format: uuid
        ruleId:
          oneOf:
            - type: 'null'
            - type: string
              format: uuid
        ruleCode: { type: string, minLength: 1, maxLength: 80 }
        severity: { type: string, enum: [low, medium, high, critical] }
        reason: { type: string, minLength: 1, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
    GuardrailCandidateResponse:
      type: object
      required: [eventId, blockedCandidate]
      properties:
        eventId: { type: string, format: uuid }
        blockedCandidate:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 20000
    CustomerCard:
      type: object
      required: [name, email, phone, company, language, channel]
      properties:
        name:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 160
        email:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 320
        phone:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 80
        company:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 200
        language: { type: string, enum: [zh-CN, en] }
        channel: { type: string, enum: [text, voice] }
    HandoffSummary:
      type: object
      required:
        [
          customerQuestion,
          confirmedFacts,
          triggerReason,
          nextStep,
          currentIntent,
          conversationSummary,
          suggestedReply,
        ]
      properties:
        customerQuestion: { type: string, minLength: 1, maxLength: 4000 }
        confirmedFacts:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        triggerReason: { type: string, minLength: 1, maxLength: 1000 }
        nextStep: { type: string, minLength: 1, maxLength: 1000 }
        currentIntent: { type: string, minLength: 1, maxLength: 240 }
        conversationSummary: { type: string, minLength: 1, maxLength: 4000 }
        suggestedReply: { type: string, minLength: 1, maxLength: 1200 }
    TeamConversationListItem:
      type: object
      required:
        [
          conversationId,
          customer,
          status,
          handoffReason,
          handoffRequestedAt,
          latestActivityAt,
          startedAt,
          acceptedBy,
          acceptedAt,
          guardrailCount,
          latestGuardrailCode,
          preview,
          summary,
          voiceSessionStatus,
        ]
      properties:
        conversationId: { type: string, format: uuid }
        customer: { $ref: '#/components/schemas/CustomerCard' }
        status:
          {
            type: string,
            enum: [active_ai, resolved_ai, handoff_requested, active_human, closed],
          }
        handoffReason:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 2000
        handoffRequestedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        latestActivityAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        acceptedBy:
          oneOf:
            - type: 'null'
            - type: string
              format: uuid
        acceptedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        guardrailCount: { type: integer, minimum: 0 }
        latestGuardrailCode:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 80
        preview:
          oneOf:
            - type: 'null'
            - type: string
              minLength: 1
              maxLength: 4000
        summary:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/HandoffSummary'
        voiceSessionStatus:
          oneOf:
            - type: 'null'
            - type: string
              enum: [warming, ready, active, handoff, closed, failed]
    TeamConversationListResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/TeamConversationListItem' }
    TeamMessage:
      type: object
      required:
        [messageId, senderType, senderUserId, text, decision, citations, createdAt]
      properties:
        messageId: { type: string, format: uuid }
        senderType: { type: string, enum: [customer, ai, human, system] }
        senderUserId:
          oneOf:
            - type: 'null'
            - type: string
              format: uuid
        text: { type: string, minLength: 1, maxLength: 20000 }
        decision:
          oneOf:
            - type: 'null'
            - type: string
              enum: [answer, clarify, handoff, human]
        citations:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Citation' }
        createdAt: { type: string, format: date-time }
    ConversationSummary:
      type: object
      required:
        [
          id,
          summary,
          primaryIntent,
          intentLevel,
          outcome,
          customerFacts,
          followUpActions,
          suggestedScript,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        summary: { type: string, minLength: 1, maxLength: 2000 }
        primaryIntent: { type: string, minLength: 1, maxLength: 200 }
        intentLevel: { type: string, enum: [low, medium, high, unknown] }
        outcome:
          {
            type: string,
            enum:
              [
                resolved_ai,
                resolved_human,
                unresolved,
                follow_up_required,
              ],
          }
        customerFacts:
          type: array
          maxItems: 20
          items:
            type: object
            required: [key, value, sourceMessageId]
            properties:
              key: { type: string, minLength: 1, maxLength: 100 }
              value: { type: string, minLength: 1, maxLength: 300 }
              sourceMessageId:
                oneOf:
                  - type: 'null'
                  - type: string
                    format: uuid
        followUpActions:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 300 }
        suggestedScript: { type: string, minLength: 1, maxLength: 1200 }
        createdAt: { type: string, format: date-time }
    TeamConversationDetail:
      allOf:
        - $ref: '#/components/schemas/TeamConversationListItem'
        - type: object
          required: [messages, guardrailEvents, summaryRecord, voiceSession]
          properties:
            messages:
              type: array
              maxItems: 500
              items: { $ref: '#/components/schemas/TeamMessage' }
            guardrailEvents:
              type: array
              maxItems: 200
              items: { $ref: '#/components/schemas/GuardrailEvent' }
            summaryRecord:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/ConversationSummary'
            voiceSession:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/TeamVoiceSession'
    VoiceServerLatency:
      type: object
      required: [sampleSize, p50Ms, p95Ms, maxMs]
      properties:
        sampleSize: { type: integer, minimum: 0 }
        p50Ms:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
        p95Ms:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
        maxMs:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
    TeamVoiceSession:
      type: object
      required:
        [
          voiceSessionId,
          provider,
          status,
          errorCode,
          createdAt,
          readyAt,
          startedAt,
          endedAt,
          warmupMs,
          serverAssistantLatency,
        ]
      properties:
        voiceSessionId: { type: string, format: uuid }
        provider: { type: string, enum: [livekit, mock] }
        status:
          {
            type: string,
            enum: [warming, ready, active, handoff, closed, failed],
          }
        errorCode:
          oneOf:
            - type: 'null'
            - type: string
              maxLength: 120
        createdAt: { type: string, format: date-time }
        readyAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        startedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        endedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        warmupMs:
          oneOf:
            - type: 'null'
            - type: integer
              minimum: 0
        serverAssistantLatency:
          $ref: '#/components/schemas/VoiceServerLatency'
    ClaimConversationResponse:
      type: object
      required: [conversationId, acceptedBy, acceptedAt, status]
      properties:
        conversationId: { type: string, format: uuid }
        acceptedBy: { type: string, format: uuid }
        acceptedAt: { type: string, format: date-time }
        status: { type: string, enum: [active_human] }
    SendHumanMessageResponse:
      type: object
      required: [created, message]
      properties:
        created: { type: boolean }
        message: { $ref: '#/components/schemas/TeamMessage' }
    CloseConversationResponse:
      type: object
      required: [conversationId, status, finalizationQueued]
      properties:
        conversationId: { type: string, format: uuid }
        status: { type: string, enum: [closed] }
        finalizationQueued: { type: boolean }
